name: Restore original toolbox and take GTA offline
on:
  push:
    branches: [codex/multiplayer-virtual-setup]
    paths: ['offline-restore/**', '.github/workflows/take-gta-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fran-abcd-abcd-production
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore original toolbox and remove the seven task-created GTA deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python offline-restore/restore.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GTA-Offline-Restoration-Verification
          path: offline-reports/*.json
          retention-days: 7
          if-no-files-found: warn
