name: Verify restored toolbox production
on:
  push:
    branches: [codex/multiplayer-virtual-setup]
    paths: ['.github/workflows/verify-toolbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GTA_PASSWORD: ${{ secrets.GTA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original tools and production password entry
        run: python restore-toolbox/probe.py --origin https://fran-abcd-abcd.pages.dev
      - uses: actions/upload-artifact@v4
        with:
          name: Restored-Toolbox-Production-Verification
          path: reports/*.json
          retention-days: 7
